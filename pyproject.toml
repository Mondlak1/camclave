[project]
name = "camclave"
version = "0.5.2"
description = "Consent-gated webcam access for Claude Code and Codex CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jack Mondlak" }]
keywords = ["claude-code", "codex-cli", "agent", "webcam", "skill", "plugin"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "opencv-python>=4.8",
    "Pillow>=10.0",
]

[project.scripts]
camclave = "camclave:main"

[project.urls]
Homepage = "https://github.com/Mondlak1/camclave"
Issues = "https://github.com/Mondlak1/camclave/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "skill/scripts" }
py-modules = ["camclave", "preview_daemon", "session"]
